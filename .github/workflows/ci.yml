name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Editor — typecheck, self-checks, bundle
        working-directory: editor
        run: |
          npm ci
          npm run check:content-template
          npm run check:routers
          npm run check:nudge
          npm run check:model-sync
          npm run check:ide-bridge
          npm run check:host-session
          npm run check:style-extensions
          npm run check:style-sync
          npm run build:app
          npm run build

      - name: IDE protocol — schema and transport tests
        working-directory: plugins/protocol
        run: |
          npm ci
          npm test

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Host and core — vet, tests and build
        run: |
          gofmt -l . | tee /dev/stderr | test -z "$(cat)"
          go vet ./...
          go test ./... -count=1 -timeout 180s
          go build ./...

      - name: Extractor Go — vet and tests
        working-directory: extractors/go
        run: |
          go vet ./...
          go test ./...

      - name: Example workspace passes the model check
        run: go run ./host check examples/example.semaps

      - name: Extractor TypeScript — tests and a run on the editor itself
        working-directory: extractors/typescript
        run: |
          npm ci
          npm test
          npm run self > /dev/null

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Extractor C# — tests and publish
        working-directory: extractors/csharp
        run: |
          dotnet test
          dotnet publish src/SeMaps.Extract.CSharp -c Release -p:UseAppHost=false -o ../../stage/extractors/csharp
