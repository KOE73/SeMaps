name: Release

# A tag `v*` builds semaps for the three platforms and attaches the binaries
# to a GitHub Release. The editor bundle is built here and embedded, so the
# artifact is one file and no Node or Go is needed to use it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Build the editor bundle
        working-directory: editor
        run: npm ci && npm run build:app

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Example workspace passes the model check
        run: go vet ./... && go run ./host check examples/example.semaps

      - name: Build binaries
        run: |
          mkdir -p out
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o out/semaps.exe ./host
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o out/semaps-linux-amd64 ./host
          GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o out/semaps-darwin-arm64 ./host

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test the C# extractor
        working-directory: extractors/csharp
        run: dotnet test

      # Extractors ship beside semaps (ADR_20260924-3 §1). Both are portable:
      # the C# one as a framework-dependent dll (`dotnet` runs it), the
      # TypeScript one as its dist plus its runtime dependency (node runs it).
      - name: Stage the extractors
        run: |
          dotnet publish extractors/csharp/src/SeMaps.Extract.CSharp -c Release -p:UseAppHost=false -o stage/extractors/csharp
          (cd extractors/typescript && npm ci && npm run build)
          mkdir -p stage/extractors/typescript
          cp -r extractors/typescript/dist stage/extractors/typescript/dist
          rm -rf stage/extractors/typescript/dist/test
          cp extractors/typescript/package.json extractors/typescript/package-lock.json stage/extractors/typescript/
          (cd stage/extractors/typescript && npm ci --omit=dev --ignore-scripts)

      - name: One archive per platform — semaps with its extractors
        run: |
          for bin in semaps.exe semaps-linux-amd64 semaps-darwin-arm64; do
            name="${bin%.exe}"; [ "$bin" = semaps.exe ] && name=semaps-windows-amd64
            rm -rf "pkg/$name" && mkdir -p "pkg/$name"
            cp "out/$bin" "pkg/$name/"
            cp -r stage/extractors "pkg/$name/extractors"
            (cd pkg && zip -qr "../out/$name.zip" "$name")
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
